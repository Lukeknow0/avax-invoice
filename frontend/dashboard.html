<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>我的收款单仪表盘 - Avax Invoice</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/6.13.2/ethers.umd.min.js"></script>
  <style>
    .badge-fuji { background: rgba(232, 65, 66, 0.1); border: 1px solid rgba(232, 65, 66, 0.3); color: #E84142; }
    .btn-avax { background: #E84142; color: white; transition: all 0.2s; }
    .btn-avax:hover { background: #d03536; }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col font-sans">
  <div class="bg-red-950/40 border-b border-red-800/30 text-xs py-2 px-4 text-center text-red-300">
    <strong>Avalanche Fuji Testnet 示范系统</strong> · 仅支持测试资产，无真实经济价值
  </div>

  <header class="border-b border-slate-800 bg-slate-900/60 backdrop-blur sticky top-0 z-50">
    <div class="max-w-5xl mx-auto px-4 h-16 flex items-center justify-between">
      <div class="flex items-center space-x-3">
        <div class="w-8 h-8 rounded-lg bg-red-600 flex items-center justify-center font-bold text-white shadow-lg shadow-red-500/20">A</div>
        <a href="index.html" class="font-bold text-lg tracking-tight hover:text-white">Avax Invoice</a>
        <span class="badge-fuji text-[11px] px-2 py-0.5 rounded-full font-medium">Fuji 43113</span>
      </div>
      <div class="flex items-center space-x-4">
        <nav class="hidden sm:flex space-x-2 text-sm">
          <a href="index.html" class="px-3 py-1.5 rounded-lg text-slate-300 hover:text-white hover:bg-slate-800 transition">首页</a>
          <a href="create.html" class="px-3 py-1.5 rounded-lg text-slate-300 hover:text-white hover:bg-slate-800 transition">新建收款单</a>
          <a href="dashboard.html" class="px-3 py-1.5 rounded-lg text-white bg-slate-800 font-medium">我的账单</a>
        </nav>
        <div id="walletBox">
          <button id="connectBtn" class="btn-avax text-sm font-medium px-4 py-2 rounded-xl shadow-md">连接钱包</button>
        </div>
      </div>
    </div>
  </header>

  <main class="flex-1 max-w-4xl mx-auto w-full px-4 py-10">
    <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 mb-8">
      <div>
        <h1 class="text-2xl font-bold text-white">我发起的收款单</h1>
        <p class="text-slate-400 text-xs mt-1">从链上实时读取当前连接地址创建的所有历史对账单</p>
      </div>
      <a href="create.html" class="btn-avax text-xs font-semibold px-4 py-2.5 rounded-xl shadow-md flex items-center space-x-1 self-start sm:self-auto">
        <span>+ 新建收款单</span>
      </a>
    </div>

    <!-- Filter Bar -->
    <div class="flex items-center space-x-2 mb-6 text-xs">
      <button class="filter-btn px-3 py-1.5 rounded-lg bg-slate-800 text-white font-medium active-filter" data-filter="all">全部</button>
      <button class="filter-btn px-3 py-1.5 rounded-lg bg-slate-900 text-slate-400 hover:text-white border border-slate-800" data-filter="pending">待付款</button>
      <button class="filter-btn px-3 py-1.5 rounded-lg bg-slate-900 text-slate-400 hover:text-white border border-slate-800" data-filter="paid">已结清</button>
    </div>

    <!-- List Container -->
    <div id="dashboardLoading" class="hidden text-center py-16">
      <div class="inline-block w-6 h-6 border-2 border-slate-700 border-t-red-500 rounded-full animate-spin mb-3"></div>
      <p class="text-xs text-slate-400">正在查询当前账户的链上记录...</p>
    </div>

    <div id="noWalletNotice" class="text-center py-16 bg-slate-900/40 border border-slate-800 rounded-2xl p-6">
      <div class="w-10 h-10 rounded-full bg-slate-800 text-slate-400 flex items-center justify-center mx-auto mb-3 text-sm">🔒</div>
      <h3 class="text-sm font-semibold text-white mb-1">请先连接钱包</h3>
      <p class="text-xs text-slate-400 mb-4">连接钱包后自动检索您发布过的收款单</p>
    </div>

    <div id="emptyNotice" class="hidden text-center py-16 bg-slate-900/40 border border-slate-800 rounded-2xl p-6">
      <div class="w-10 h-10 rounded-full bg-slate-800 text-slate-400 flex items-center justify-center mx-auto mb-3 text-sm">📄</div>
      <h3 class="text-sm font-semibold text-white mb-1">暂无收款单</h3>
      <p class="text-xs text-slate-400 mb-4">您尚未在当前合约上创建过任何款项请求</p>
      <a href="create.html" class="btn-avax text-xs font-semibold px-4 py-2 rounded-lg">创建第一笔</a>
    </div>

    <div id="invoiceGrid" class="hidden grid grid-cols-1 md:grid-cols-2 gap-4">
      <!-- Populated by JS -->
    </div>
  </main>

  <script type="module" src="app.js"></script>
</body>
</html>
