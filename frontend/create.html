<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>创建收款单 - Avax Invoice</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/6.13.2/ethers.umd.min.js"></script>
  <style>
    .badge-fuji { background: rgba(232, 65, 66, 0.1); border: 1px solid rgba(232, 65, 66, 0.3); color: #E84142; }
    .btn-avax { background: #E84142; color: white; transition: all 0.2s; }
    .btn-avax:hover { background: #d03536; }
    .btn-avax:disabled { background: #475569; cursor: not-allowed; }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col font-sans">
  <div class="bg-red-950/40 border-b border-red-800/30 text-xs py-2 px-4 text-center text-red-300">
    <strong>Avalanche Fuji Testnet 示范系统</strong> · 仅支持测试资产，无真实经济价值
  </div>

  <header class="border-b border-slate-800 bg-slate-900/60 backdrop-blur sticky top-0 z-50">
    <div class="max-w-5xl mx-auto px-4 h-16 flex items-center justify-between">
      <div class="flex items-center space-x-3">
        <div class="w-8 h-8 rounded-lg bg-red-600 flex items-center justify-center font-bold text-white shadow-lg shadow-red-500/20">A</div>
        <a href="index.html" class="font-bold text-lg tracking-tight hover:text-white">Avax Invoice</a>
        <span class="badge-fuji text-[11px] px-2 py-0.5 rounded-full font-medium">Fuji 43113</span>
      </div>
      <div class="flex items-center space-x-4">
        <nav class="hidden sm:flex space-x-2 text-sm">
          <a href="index.html" class="px-3 py-1.5 rounded-lg text-slate-300 hover:text-white hover:bg-slate-800 transition">首页</a>
          <a href="create.html" class="px-3 py-1.5 rounded-lg text-white bg-slate-800 font-medium">新建收款单</a>
          <a href="dashboard.html" class="px-3 py-1.5 rounded-lg text-slate-300 hover:text-white hover:bg-slate-800 transition">我的账单</a>
        </nav>
        <div id="walletBox">
          <button id="connectBtn" class="btn-avax text-sm font-medium px-4 py-2 rounded-xl shadow-md">连接钱包</button>
        </div>
      </div>
    </div>
  </header>

  <main class="flex-1 max-w-xl mx-auto w-full px-4 py-10">
    <div class="mb-6">
      <a href="index.html" class="text-xs text-slate-400 hover:text-slate-200 flex items-center space-x-1 mb-2">
        <span>← 返回首页</span>
      </a>
      <h1 class="text-2xl font-bold text-white">发起链上收款请求</h1>
      <p class="text-slate-400 text-sm mt-1">创建后将生成公开链接，客户付款后资金直达您的私钥钱包。</p>
    </div>

    <!-- Creation Card -->
    <div class="bg-slate-900/80 border border-slate-800 p-6 rounded-2xl shadow-xl">
      <div class="mb-5">
        <label class="block text-xs font-semibold text-slate-300 mb-2 uppercase tracking-wider">收款金额 (AVAX)</label>
        <div class="relative">
          <input type="number" step="0.0001" min="0.0001" id="amountInput" placeholder="例如：0.05"
            class="w-full bg-slate-950 border border-slate-700 rounded-xl px-4 py-3 text-white text-lg font-semibold placeholder:text-slate-600 focus:outline-none focus:border-red-500 focus:ring-1 focus:ring-red-500 transition" />
          <span class="absolute right-4 top-3.5 text-xs font-bold text-slate-400 bg-slate-800 px-2 py-1 rounded-md">AVAX</span>
        </div>
        <p class="text-[11px] text-slate-500 mt-2">合约将在底层校验金额，仅支持严格一致的金额支付。</p>
      </div>

      <div class="mb-6">
        <label class="block text-xs font-semibold text-slate-300 mb-2 uppercase tracking-wider">收款人地址 (只读绑定)</label>
        <div id="payeeDisplay" class="bg-slate-950/80 border border-slate-800 rounded-xl px-4 py-3 text-xs text-slate-400 font-mono break-all">
          请先点击右上角连接钱包
        </div>
        <p class="text-[11px] text-slate-500 mt-2">根据安全设计，收款人必须是当前发起的钱包地址，杜绝中间人篡改。</p>
      </div>

      <button id="submitCreateBtn" disabled class="btn-avax w-full py-3.5 rounded-xl font-semibold text-sm shadow-lg shadow-red-500/20">
        确认并在链上创建
      </button>

      <div id="createStatus" class="hidden mt-4 p-4 rounded-xl text-xs"></div>
    </div>

    <!-- Success Modal Card -->
    <div id="resultCard" class="hidden mt-6 bg-emerald-950/40 border border-emerald-800/40 p-6 rounded-2xl">
      <div class="flex items-center space-x-2 text-emerald-400 font-semibold text-sm mb-2">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>
        <span>收款单已成功部署上链！</span>
      </div>
      <p class="text-xs text-slate-300 mb-4">将此专属支付链接发送给付款方即可：</p>
      <div class="flex items-center space-x-2 mb-4">
        <input type="text" id="shareUrlInput" readonly class="flex-1 bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-xs text-slate-300 font-mono select-all" />
        <button id="copyBtn" class="bg-slate-800 hover:bg-slate-700 text-xs px-3 py-2 rounded-lg text-slate-200 transition font-medium">复制</button>
      </div>
      <div class="flex justify-between items-center text-xs">
        <a id="viewDetailLink" href="#" class="text-red-400 hover:underline">立即前往订单页 →</a>
        <a id="explorerTxLink" href="#" target="_blank" class="text-slate-400 hover:underline">在 Snowtrace 验证交易 ↗</a>
      </div>
    </div>
  </main>

  <script type="module" src="app.js"></script>
</body>
</html>
